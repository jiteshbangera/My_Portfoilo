<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transparent Cut-Out Text Zoom to Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #09090b;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* ===== HOME PAGE (visible through the transparent letters) ===== */
        .home-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 6%;
            background: radial-gradient(circle at 75% 25%, #1e3a8a 0%, #09090b 65%);
            transform: scale(1.1);
            animation: homeZoomSettle 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: 1.5s;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            transform: translateY(-15px);
            animation: revealDown 0.8s ease forwards;
            animation-delay: 2.0s;
        }

        .logo {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: 0.08em;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            font-size: 0.95rem;
            color: #cbd5e1;
        }

        .hero {
            max-width: 720px;
            margin: auto 0;
        }

        .hero-tag {
            display: inline-block;
            padding: 0.35rem 0.9rem;
            border-radius: 999px;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            opacity: 0;
            transform: translateY(20px);
            animation: revealUp 0.8s ease forwards;
            animation-delay: 1.9s;
        }

        .hero h1 {
            font-size: clamp(2.8rem, 6vw, 5.2rem);
            font-weight: 800;
            line-height: 1.08;
            margin-bottom: 1.25rem;
            opacity: 0;
            transform: translateY(25px);
            animation: revealUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: 2.05s;
        }

        .hero p {
            font-size: 1.15rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 2rem;
            opacity: 0;
            transform: translateY(20px);
            animation: revealUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: 2.2s;
        }

        .hero-actions {
            display: flex;
            gap: 1rem;
            opacity: 0;
            transform: translateY(20px);
            animation: revealUp 0.8s ease forwards;
            animation-delay: 2.35s;
        }

        .btn-primary {
            padding: 0.9rem 1.8rem;
            border-radius: 999px;
            background: #fff;
            color: #09090b;
            font-weight: 600;
            text-decoration: none;
        }

        .btn-secondary {
            padding: 0.9rem 1.8rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            font-weight: 600;
            text-decoration: none;
        }

        .footer-note {
            font-size: 0.85rem;
            color: #64748b;
            opacity: 0;
            animation: revealUp 0.8s ease forwards;
            animation-delay: 2.45s;
        }

        /* ===== PRELOADER: dark cover with HELLO punched out (truly transparent) ===== */
        .preloader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            pointer-events: none;
            overflow: hidden;
            animation: removeOverlay 0.3s ease forwards;
            animation-delay: 2.8s;
        }

        .preloader svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Zoom straight into the center of the "O" */
        .o-open {
            opacity: 0;
            animation: openO 1.4s ease-in forwards;
            animation-delay: 0.9s;
        }

        @keyframes openO {
            to {
                opacity: 1;
            }
        }

        .zoom-group {
            transform-box: view-box;
            transform-origin: 1410px 540px;
            animation: zoomThroughLetter 2.1s cubic-bezier(0.76, 0, 0.24, 1) forwards;
            animation-delay: 0.7s;
        }

        @keyframes zoomThroughLetter {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(55);
            }
        }

        @keyframes removeOverlay {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        @keyframes homeZoomSettle {
            to {
                transform: scale(1);
            }
        }

        @keyframes revealUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes revealDown {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- HOME PAGE -->
    <div class="home-page">
        <nav class="navbar">
            <div class="logo">PORTFOLIO</div>
            <ul class="nav-links">
                <li>Home</li>
                <li>About</li>
                <li>Projects</li>
                <li>Contact</li>
            </ul>
        </nav>

        <section class="hero">
            <span class="hero-tag">Available for Work</span>
            <h1>Full-Stack Developer &amp; UI Designer</h1>
            <p>Crafting fast, interactive websites with clean typography and seamless transitions.</p>
            <div class="hero-actions">
                <a href="#projects" class="btn-primary">View Projects</a>
                <a href="#contact" class="btn-secondary">Let's Talk</a>
            </div>
        </section>

        <footer class="footer-note">Scroll down to explore more</footer>
    </div>

    <!-- PRELOADER: letters are real holes, so the home page shows through -->
    <div class="preloader">
        <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <mask id="letterHole" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
                    <!-- white = keep the dark cover, black text = cut a transparent hole -->
                    <rect width="1920" height="1080" fill="white" />
                    <text x="960" y="540" dominant-baseline="central" text-anchor="middle"
                        font-family="Arial Black, Impact, sans-serif" font-size="320" font-weight="900"
                        letter-spacing="12" fill="black">HELLO</text>
                    <!-- Center of the "O" opens up while zooming, so you fly through it -->
                    <ellipse class="o-open" cx="1410" cy="540" rx="80" ry="105" fill="black" />
                </mask>
            </defs>
            <g class="zoom-group">
                <rect width="1920" height="1080" fill="#050507" mask="url(#letterHole)" />
            </g>
        </svg>
    </div>

</body>

</html>
